# ============================================================
# Group config — EDIT ME (one per group). Values here override
# the track defaults loaded from `track_config`.
# ============================================================
group_id: G02                     # e.g. G07
owner: "Hoàng Quốc Mạnh (Data QA lead)"   # mandatory for every Decision
track_config: tracks/t11.yaml     # pick your challenge: tracks/t01.yaml ... tracks/t14.yaml
track: t11                        # must match track_config
input: fixtures/t11_label_errors        # or data/real/... if your instructor provided a real pack
output: out/
seed: 42
offline: true                     # demo/eval must not touch the network
strict_provenance: true           # fail if manifest.csv hashes do not match

# Track params (merged over track_config.params). Freeze before evaluation.
# FROZEN 2026-11-14 — chọn trên dev (reports/t11_dev_selfcheck.csv: Precision@10 = 9/10), chưa nhìn heldout.
params:
  swap_min_iou: 0.5
  shift_low_iou: 0.05
  shift_high_iou: 0.6
  dup_min_iou: 0.5
  miss_min_conf: 0.5
  miss_max_iou: 0.1
  no_match_score: 0.2
